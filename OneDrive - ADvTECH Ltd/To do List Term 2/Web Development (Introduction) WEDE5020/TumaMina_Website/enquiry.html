<!DOCTYPE html>
<html lang="en">
    <!-- enquiry.html - TumaMina Enquiry - Part 3 -->
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Verifier | TumaMina</title>
    <meta name="description" content="Book a TumaMina verifier to inspect an item before you buy. Fill in the details and we'll get back to you.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">Tuma<span>Mina</span></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="enquiry.html">Book a Verifier</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="content-section">
            <div class="container">
                <h1>Book a Verifier</h1>
                <p>Fill in the form below and we'll match you with a trusted verifier in the seller's city.</p>

                <form class="enquiry-form" action="#" method="post">
                    <label for="itemName">Item Name:</label>
                    <input type="text" id="itemName" name="itemName" required>

                    <label for="itemPrice">Item Price (R):</label>
                    <input type="number" id="itemPrice" name="itemPrice" required>

                    <label for="sellerLocation">Seller Location (City):</label>
                    <input type="text" id="sellerLocation" name="sellerLocation" required>

                    <label for="buyerLocation">Buyer Location (City):</label>
                    <input type="text" id="buyerLocation" name="buyerLocation" required>

                    <label for="instructions">Special Instructions:</label>
                    <textarea id="instructions" name="instructions" rows="5"></textarea>

                    <button type="submit" class="btn btn-primary">Submit Enquiry</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>

                <a href="contact.html">Contact</a>
            </div>
            <p>&copy; 2026 TumaMina. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
